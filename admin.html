<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://wnlsxtmekyvtizdwxxuc.supabase.co wss://wnlsxtmekyvtizdwxxuc.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1E3F8A">
<title>Administration · Classe Master</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
:root{--bg:#f2f5f9;--surface:#fff;--ink:#16202e;--mute:#5d6b7e;--line:#d9e0ea;--p:#1f7a4d;--a:#b42b3a;--accent:#1E3F8A;--soft:#e6ecf8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1424;--surface:#192232;--ink:#e8edf5;--mute:#9aa8bc;--line:#2b3850;--p:#5fd08e;--a:#ff8591;--accent:#8fb0f5;--soft:#22304a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 2px}h2{font-size:1.05rem;margin:0 0 8px}
.sub{color:var(--mute);font-size:.9rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;min-height:42px;background:var(--accent);color:var(--bg);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.warn{background:var(--soft);color:var(--a)}
.btn:disabled{opacity:.5;cursor:default}
.bs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.st{border-top:1px solid var(--line);padding:12px 0}
.st:first-of-type{border-top:0}
.st b{font-size:1.02rem}
.cd{font:700 1.05rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--soft);border-radius:8px;padding:6px 10px;display:inline-block;margin:6px 0}
.st .bs .btn{padding:7px 11px;min-height:38px;font-size:.88rem}
#msg{min-height:1.3em;margin:8px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#pr{display:none}
.cards-grid{font-size:0}
.card-p{border:1px dashed #555;border-radius:4mm;padding:4mm;display:inline-flex;width:calc(50% - 4mm);margin:0 4mm 6mm 0;vertical-align:top;gap:4mm;align-items:center;break-inside:avoid;page-break-inside:avoid;color:#000;background:#fff;font-size:10pt;box-sizing:border-box}
.cp-t{position:absolute;width:1px;height:1px;overflow:hidden}
.cp-q svg{width:34mm;height:34mm;display:block}
.cp-c{font:700 13pt ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;margin:2mm 0}
.cp-i small{display:block;font-size:8pt;color:#333}
@media print{body{background:#fff}main>*:not(#pr){display:none!important}#pr{display:block}@page{size:A4;margin:10mm}}
</style>
</head>
<body>
<main id="app"><p class="sub" style="text-align:center;margin-top:40px">Chargement…</p></main>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/qr.js"></script>
<script>
(function(){
  var app=document.getElementById("app"),AL="ABCDEFGHJKMNPQRSTUVWXYZ23456789",rows=[],filt="",shown={},me=null,asg=[],qtxt="",lim=50,ed={};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function nrm(x){return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
  /* Aléatoire de qualité cryptographique, sans O/0/I/1/L ; 248 = 31×8 : pas de biais */
  function gen(n){var o="",a=new Uint8Array(32),i;while(o.length<n){crypto.getRandomValues(a);for(i=0;i<a.length&&o.length<n;i++)if(a[i]<248)o+=AL.charAt(a[i]%31);}return o;}
  function fmt(k){return String(k).replace(/(.{4})(?=.)/g,"$1-");}
  function link(code){return new URL("parent.html?c="+encodeURIComponent(code),location.href).href;}
  function intl(v){var d=String(v||"").replace(/[^\d+]/g,""),plus=d.charAt(0)==="+";d=d.replace(/\D/g,"");if(!d)return"";if(!plus){if(d.slice(0,2)==="00")d=d.slice(2);else if(d.slice(0,3)!=="242"||d.length<11)d="242"+d;}return d.length>=8&&d.length<=15?d:"";}
  function say(t){var e=document.getElementById("msg");if(e)e.textContent=t;}
  function fail(e){return"Échec : "+((e&&e.message)||"erreur")+(/registry_students|relation|schema/i.test((e&&e.message)||"")?" — exécutez d’abord supabase/partage-admin.sql dans Supabase.":"");}
  function download(name,txt){var b=new Blob(["\ufeff"+txt],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();}
  function q(x){return'"'+String(x).replace(/"/g,'""')+'"';}

  /* ---------- Connexion ---------- */
  function login(note){
    app.innerHTML='<h1>Administration</h1><p class="sub">Dossiers des élèves et liens parents · Classe Master</p><div class="card"><h2>Connexion</h2><label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><div class="bs"><button class="btn" id="in">Se connecter</button><button class="btn ghost" id="up">Créer le compte administrateur</button></div><p class="sub" id="msg" role="status">'+esc(note||"")+'</p></div><p class="sub">Les codes des élèves ne sont visibles que sur cette page. Gardez ce mot de passe pour vous seul.</p>';
    function go(create){
      var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;
      if(!em||!pw){say("Entrez l’e-mail et le mot de passe.");return;}
      say("Connexion…");
      var p=create?sb.auth.signUp({email:em,password:pw}):sb.auth.signInWithPassword({email:em,password:pw});
      p.then(function(r){
        if(r.error){say(r.error.code==="invalid_credentials"?"E-mail ou mot de passe incorrect.":(r.error.message||"Échec de la connexion."));return;}
        if(!r.data||!r.data.session){say("Compte créé : confirmez l’e-mail reçu puis connectez-vous.");return;}
        me=r.data.session.user;guard();
      },function(){say("Pas d’internet.");});
    }
    document.getElementById("in").onclick=function(){go(false);};
    document.getElementById("up").onclick=function(){go(true);};
  }

  /* ---------- Contrôle d'accès : seuls les comptes de public.admin_users entrent (voir supabase/acces-admin.sql) ---------- */
  function guard(){
    sb.rpc("is_admin").then(function(r){
      if(r.error){load();return;}   /* acces-admin.sql pas encore exécuté : comportement d'avant */
      if(r.data===true){load();return;}
      app.innerHTML='<div style="text-align:center;padding:40px 10px"><h1>Accès réservé</h1><p class="sub">Le compte '+esc((me&&me.email)||"")+' n’a pas accès au mode administrateur.</p><div class="bs" style="justify-content:center"><a class="btn ghost" href="./" style="text-decoration:none">← Retour à l’application</a><button class="btn" id="out2">Changer de compte</button></div></div>';
      document.getElementById("out2").onclick=function(){sb.auth.signOut().then(function(){me=null;rows=[];login("Déconnecté.");});};
    },function(){login("Pas d’internet.");});
  }

  /* ---------- Chargement ---------- */
  function load(){
    rows=[];
    (function page(from){
      sb.from("registry_students").select("id,name,class_label,ref,code,phone").order("class_label").order("name").range(from,from+999).then(function(r){
        if(r.error){main();say(fail(r.error));return;}
        rows=rows.concat(r.data||[]);
        if((r.data||[]).length===1000)page(from+1000);else loadAsg();
      },function(){main();say("Pas d’internet.");});
    })(0);
  }
  function loadAsg(){
    sb.rpc("admin_assignments").then(function(r){asg=r.error?[]:(r.data||[]);main();},function(){asg=[];main();});
  }
  function classes(){var o={};rows.forEach(function(r){o[r.class_label||""]=1;});return Object.keys(o).sort(function(a,b){return a.localeCompare(b,"fr");});}
  function view(){var t=nrm(qtxt);return rows.filter(function(r){return(filt==="__all"||filt===""?true:(r.class_label||"")===filt)&&(!t||nrm(r.name).indexOf(t)>=0||nrm(r.class_label||"").indexOf(t)>=0);});}

  /* ---------- Page principale ---------- */
  function main(){
    var cl=classes(),V=view(),keep=document.activeElement&&document.activeElement.id==="qs";
    var h='<div class="top"><div><h1>Administration</h1><p class="sub">'+rows.length+' élève'+(rows.length>1?"s":"")+' · '+esc((me&&me.email)||"")+'</p></div><div class="bs" style="margin:0"><a class="btn ghost" href="./" style="text-decoration:none;display:inline-flex;align-items:center">← Application</a><button class="btn ghost" id="out">Se déconnecter</button></div></div>';
    h+='<div class="card"><h2>Reprendre mes classes existantes</h2><p class="sub" style="margin:0">Crée automatiquement un dossier, avec son code, pour chaque élève déjà présent dans les classes de ce compte (classes archivées exclues). Les élèves déjà créés sont ignorés.</p><div class="bs"><button class="btn" id="imp">Attribuer un code à tous mes élèves</button></div></div>';
    h+='<div class="card"><h2>Ajouter des élèves</h2><p class="sub" style="margin:0 0 6px">Un élève par ligne : <b>Nom;Classe</b> (la classe est facultative). Chaque élève reçoit automatiquement son code secret.</p>'+
      '<label for="dc">Classe pour les lignes sans classe</label><input id="dc" type="text" placeholder="ex. 2nde C" autocomplete="off">'+
      '<label for="ta">Liste</label><textarea id="ta" placeholder="Jean Kimbembe;2nde C&#10;Marie Ngoma;2nde C"></textarea>'+
      '<div class="bs"><button class="btn" id="add">Créer les dossiers</button><label class="btn ghost" style="margin:0;display:inline-block" for="fl">Charger un fichier CSV</label><input id="fl" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain" style="display:none"></div></div>';
    h+='<div class="card"><h2>Enseignants</h2><p class="sub" style="margin:0 0 6px">Un enseignant ne peut lier ses élèves et lire leur code que si vous les lui affectez ici (par l’e-mail de son compte Classe Master).</p>'+
      '<label for="te">E-mail de l’enseignant</label><input id="te" type="email" autocomplete="off" placeholder="enseignant@exemple.com">'+
      '<label for="tc">Classe</label><select id="tc"><option value="">Tous les élèves</option>'+cl.map(function(c){return'<option value="'+esc(c)+'">'+esc(c||"(sans classe)")+'</option>';}).join("")+'</select>'+
      '<div class="bs"><button class="btn" id="tas"'+(rows.length?"":" disabled")+'>Affecter</button></div>'+
      (asg.length?'<div style="margin-top:12px">'+asg.map(function(a,i){return'<div class="st" style="padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px"><span><b>'+esc(a.email)+'</b><br><span class="sub">'+esc(a.class_label||"(sans classe)")+' · '+a.n+' élève'+(a.n>1?"s":"")+'</span></span><button class="btn warn" style="min-height:36px;padding:6px 10px" data-un="'+i+'">Retirer</button></div>';}).join("")+'</div>':'<p class="sub" style="margin-top:10px">Aucune affectation.</p>')+'</div>';
    h+='<div class="card"><h2>Élèves</h2><label for="ft">Classe</label><select id="ft"><option value="__all">Toutes les classes</option>'+cl.map(function(c){return'<option value="'+esc(c)+'"'+(filt===c?" selected":"")+'>'+esc(c||"(sans classe)")+'</option>';}).join("")+'</select>'+
      '<label for="qs">Rechercher (nom ou classe)</label><input id="qs" type="search" autocomplete="off" value="'+esc(qtxt)+'" placeholder="ex. Kimbembe">'+
      '<p class="sub" style="margin:6px 0 0">'+V.length+' élève'+(V.length>1?"s":"")+(V.length>lim?" · "+lim+" affichés":"")+'</p>'+
      '<div class="bs"><button class="btn" id="cards"'+(V.length?"":" disabled")+'>Imprimer les cartes de codes (QR)</button><button class="btn warn" id="rotall"'+(V.length?"":" disabled")+'>Nouveaux codes pour cette sélection</button></div>'+
      '<div class="bs"><button class="btn ghost" id="ex1"'+(V.length?"":" disabled")+'>Liste pour les enseignants (sans code)</button><button class="btn ghost" id="ex2"'+(V.length?"":" disabled")+'>Liste confidentielle (avec codes)</button></div>'+
      '<p class="sub" style="margin-top:8px">La liste enseignants contient Nom, Classe et Réf : la Réf ne permet rien lire. Chaque enseignant l’importe dans sa classe.</p>';
    if(!V.length)h+='<p class="sub" style="margin-top:12px">Aucun élève.</p>';
    V.slice(0,lim).forEach(function(r){
      var open=!!shown[r.id];
      h+='<div class="st">'+(ed[r.id]?'<label for="en'+r.id+'">Nom</label><input id="en'+r.id+'" type="text" value="'+esc(r.name)+'" maxlength="120"><label for="ec'+r.id+'">Classe</label><input id="ec'+r.id+'" type="text" value="'+esc(r.class_label||"")+'" maxlength="80"><div class="bs"><button class="btn" data-act="save" data-id="'+r.id+'">Enregistrer</button><button class="btn ghost" data-act="cancel" data-id="'+r.id+'">Annuler</button></div>':'<b>'+esc(r.name)+'</b> <span class="sub">'+esc(r.class_label||"")+'</span> <button class="btn ghost" style="min-height:30px;padding:3px 9px;font-size:.8rem" data-act="edit" data-id="'+r.id+'">Modifier</button>')+
        (open?'<div><span class="cd">'+esc(fmt(r.code))+'</span></div>':'')+
        '<label for="ph'+r.id+'">Téléphone du parent (facultatif)</label><input id="ph'+r.id+'" type="tel" inputmode="tel" data-ph="'+r.id+'" value="'+esc(r.phone||"")+'" placeholder="06 123 45 67">'+
        '<div class="bs"><button class="btn ghost" data-act="show" data-id="'+r.id+'">'+(open?"Masquer le code":"Afficher le code")+'</button><button class="btn" data-act="wa" data-id="'+r.id+'">WhatsApp</button><button class="btn ghost" data-act="cp" data-id="'+r.id+'">Copier le lien</button><button class="btn warn" data-act="rot" data-id="'+r.id+'">Nouveau code</button><button class="btn warn" data-act="del" data-id="'+r.id+'">Supprimer</button></div></div>';
    });
    if(V.length>lim)h+='<div class="bs"><button class="btn ghost" id="more">Afficher 50 de plus</button></div>';
    h+='</div><p class="sub" id="msg" role="status"></p><div id="pr" aria-hidden="true"></div>';
    app.innerHTML=h;
    bind();
    if(keep){var qi=document.getElementById("qs");if(qi){qi.focus();var L=qi.value.length;try{qi.setSelectionRange(L,L);}catch(e){}}}
  }
  function get(id){return rows.find(function(r){return r.id===id;});}

  function bind(){
    document.getElementById("out").onclick=function(){sb.auth.signOut().then(function(){me=null;rows=[];login("Déconnecté.");});};
    document.getElementById("ft").onchange=function(e){filt=e.target.value;lim=50;main();};
    document.getElementById("qs").oninput=function(e){qtxt=e.target.value;lim=50;main();};
    var mo=document.getElementById("more");if(mo)mo.onclick=function(){lim+=50;main();};
    document.getElementById("cards").onclick=printCards;
    document.getElementById("rotall").onclick=rotAll;
    document.getElementById("fl").onchange=function(e){
      var f=e.target.files&&e.target.files[0];if(!f)return;
      var fr=new FileReader();fr.onload=function(){document.getElementById("ta").value=String(fr.result).replace(/^\ufeff/,"");say("Fichier chargé : vérifiez la liste puis touchez « Créer les dossiers ».");};fr.onerror=function(){say("Impossible de lire ce fichier.");};fr.readAsText(f);e.target.value="";
    };
    document.getElementById("tas").onclick=function(){
      var em=document.getElementById("te").value.trim(),cs=document.getElementById("tc").value;
      if(!/^\S+@\S+\.\S+$/.test(em)){say("Entrez l’e-mail du compte de l’enseignant.");return;}
      say("Affectation…");
      sb.rpc("admin_assign",{p_email:em,p_class:cs}).then(function(r){
        if(r.error){say(/unknown teacher/i.test(r.error.message||"")?"Aucun compte avec cet e-mail : l’enseignant doit d’abord créer son compte Classe Master.":/not admin/i.test(r.error.message||"")?"Ce compte n’est pas administrateur.":fail(r.error)+(/admin_assign|function/i.test(r.error.message||"")?" — exécutez d’abord supabase/securite-v32.sql dans Supabase.":""));return;}
        loadAsg();setTimeout(function(){say(r.data+" élève"+(r.data>1?"s":"")+" affecté"+(r.data>1?"s":"")+" à "+em+".");},400);
      },function(){say("Pas d’internet.");});
    };
    document.querySelectorAll("[data-un]").forEach(function(b){b.onclick=function(){
      var a=asg[+b.dataset.un];if(!a||!confirm("Retirer "+a.email+" de "+(a.class_label||"(sans classe)")+" ?"))return;
      sb.rpc("admin_unassign",{p_email:a.email,p_class:a.class_label||""}).then(function(r){if(r.error){say(fail(r.error));return;}loadAsg();},function(){say("Pas d’internet.");});
    };});
    document.getElementById("add").onclick=add;
    document.getElementById("imp").onclick=importMine;
    document.getElementById("ex1").onclick=function(){var L=["Nom;Classe;Réf"];view().forEach(function(r){L.push([q(r.name),q(r.class_label||""),r.ref].join(";"));});download("liste-enseignants"+(filt&&filt!=="__all"?"-"+filt.replace(/[^\w-]+/g,"_"):"")+".csv",L.join("\r\n"));say("Liste enseignants créée (sans code).");};
    document.getElementById("ex2").onclick=function(){var L=["Nom;Classe;Code;Lien"];view().forEach(function(r){L.push([q(r.name),q(r.class_label||""),fmt(r.code),link(r.code)].join(";"));});download("liste-confidentielle"+(filt&&filt!=="__all"?"-"+filt.replace(/[^\w-]+/g,"_"):"")+".csv",L.join("\r\n"));say("Liste confidentielle créée : ne la transmettez pas aux enseignants.");};
    app.onchange=function(e){
      var id=e.target.dataset&&e.target.dataset.ph;if(!id)return;
      var r=get(id),v=e.target.value.trim();if(!r)return;
      if(v&&!intl(v)){say("Ce numéro ne semble pas valide.");return;}
      sb.from("registry_students").update({phone:v}).eq("id",id).then(function(x){if(x.error)say(fail(x.error));else{r.phone=v;say("Numéro enregistré.");}});
    };
    app.onclick=function(e){
      var b=e.target.closest("[data-act]");if(!b)return;
      var r=get(b.dataset.id),act=b.dataset.act;if(!r)return;
      if(act==="show"){shown[r.id]=!shown[r.id];main();return;}
      if(act==="edit"){ed[r.id]=true;main();return;}
      if(act==="cancel"){delete ed[r.id];main();return;}
      if(act==="save"){
        var nn=document.getElementById("en"+r.id).value.trim(),nc2=document.getElementById("ec"+r.id).value.trim();
        if(!nn){say("Le nom ne peut pas être vide.");return;}
        var kk=nrm(nn)+"|"+nrm(nc2);
        if(rows.some(function(y){return y.id!==r.id&&nrm(y.name)+"|"+nrm(y.class_label||"")===kk;})){say("Un élève de même nom existe déjà dans cette classe.");return;}
        sb.from("registry_students").update({name:nn,class_label:nc2}).eq("id",r.id).then(function(x){if(x.error){say(fail(x.error));return;}r.name=nn;r.class_label=nc2;delete ed[r.id];main();say("Élève modifié.");},function(){say("Pas d’internet.");});return;
      }
      if(act==="cp"){
        var u=link(r.code),ok=function(){say("Lien copié pour "+r.name+".");};
        try{navigator.clipboard.writeText(u).then(ok,function(){say(u);});}catch(er){say(u);}return;
      }
      if(act==="wa"){
        var t=intl(r.phone),txt="Bonjour, voici le lien unique pour suivre les présences, les notes et les devoirs de "+r.name+" dans toutes les matières : "+link(r.code);
        window.open("https://wa.me/"+(t||"")+"?text="+encodeURIComponent(txt),"_blank","noopener");return;
      }
      if(act==="rot"){
        if(!confirm("Créer un nouveau code pour "+r.name+" ? L’ancien lien cessera de fonctionner : il faudra renvoyer le nouveau au parent."))return;
        var nc=gen(12);
        sb.from("registry_students").update({code:nc}).eq("id",r.id).then(function(x){if(x.error){say(fail(x.error));return;}r.code=nc;main();say("Nouveau code créé pour "+r.name+".");});return;
      }
      if(act==="del"){
        if(!confirm("Supprimer le dossier de "+r.name+" ? Son lien famille cessera de fonctionner."))return;
        sb.from("registry_students").delete().eq("id",r.id).then(function(x){if(x.error){say(fail(x.error));return;}rows=rows.filter(function(y){return y.id!==r.id;});main();say("Dossier supprimé.");});
      }
    };
  }

  /* Cartes de codes : une carte par élève (QR + code), à imprimer ou enregistrer en PDF */
  function printCards(){
    var V=view();if(!V.length)return;
    if(V.length>300&&!confirm(V.length+" cartes : l’impression peut être longue. Continuer ?"))return;
    var h='<div class="cards-grid">';
    V.forEach(function(r){
      var svg="";try{svg=QR.svg(link(r.code),150);}catch(e){}
      h+='<div class="card-p"><div class="cp-t">Classe Master · Suivi parent</div><div class="cp-q">'+svg+'</div><div class="cp-i"><b>'+esc(r.name)+'</b><br><span>'+esc(r.class_label||"")+'</span><div class="cp-c">'+esc(fmt(r.code))+'</div><small>Scannez le QR code pour voir les présences, notes et devoirs de votre enfant.</small></div></div>';
    });
    document.getElementById("pr").innerHTML=h+'</div>';
    say("Cartes prêtes : choisissez « Enregistrer en PDF » dans la fenêtre d’impression. Ces cartes contiennent des codes secrets : ne les montrez qu’aux parents concernés.");
    setTimeout(function(){window.print();},150);
  }
  /* Nouveaux codes pour tous les élèves de la sélection (les anciens liens cessent de fonctionner) */
  function rotAll(){
    var V=view();if(!V.length||!me)return;
    if(!confirm("Créer de nouveaux codes pour "+V.length+" élève"+(V.length>1?"s":"")+" ? Tous leurs anciens liens et codes cesseront de fonctionner : il faudra renvoyer les nouveaux aux parents."))return;
    var btn=document.getElementById("rotall");btn.disabled=true;say("Création des nouveaux codes…");
    var done=0;
    (function chunk(a){
      if(a>=V.length){load();setTimeout(function(){say(done+" nouveau"+(done>1?"x":"")+" code"+(done>1?"s":"")+" créé"+(done>1?"s":"")+". Imprimez ou exportez les cartes pour les redistribuer.");},500);return;}
      var part=V.slice(a,a+100),tries=0;
      (function send(){
        var recs=part.map(function(r){return{id:r.id,user_id:me.id,name:r.name,class_label:r.class_label||"",phone:r.phone||"",ref:r.ref,code:gen(12)};});
        sb.from("registry_students").upsert(recs,{onConflict:"id"}).then(function(w){
          if(w.error){if(w.error.code==="23505"&&tries++<3){send();return;}load();setTimeout(function(){say(fail(w.error)+" ("+done+" code(s) déjà renouvelé(s))");},500);return;}
          done+=part.length;chunk(a+100);
        },function(){btn.disabled=false;say("Pas d’internet ("+done+" code(s) déjà renouvelé(s)).");});
      })();
    })(0);
  }

  /* Création : un code et une référence aléatoires par élève */
  function add(){
    var dc=document.getElementById("dc").value.trim(),txt=document.getElementById("ta").value,have={},list=[],dup=0;
    rows.forEach(function(r){have[nrm(r.name)+"|"+nrm(r.class_label||"")]=1;});
    txt.split(/\r?\n/).forEach(function(l,i){
      var p=l.split(/\t|;/).map(function(x){return x.replace(/^"|"$/g,"").trim();});
      if(!p[0])return;
      if(i===0&&/^(nom|noms|eleve|eleves)$/.test(nrm(p[0])))return;   /* ligne d'en-tête */
      var cls=p[1]||dc,k=nrm(p[0])+"|"+nrm(cls);
      if(have[k]){dup++;return;}
      have[k]=1;list.push({name:p[0],class_label:cls});
    });
    if(!list.length){say(dup?"Aucun nouvel élève : "+dup+" déjà dans la liste.":"Aucun nom trouvé.");return;}
    if(!confirm(list.length+" dossier"+(list.length>1?"s":"")+" à créer"+(dup?" ("+dup+" déjà existant"+(dup>1?"s":"")+", ignoré"+(dup>1?"s":"")+")":"")+". Continuer ?"))return;
    say("Création…");document.getElementById("add").disabled=true;
    (function chunk(a){
      if(a>=list.length){document.getElementById("add").disabled=false;load();return;}
      var part=list.slice(a,a+200),tries=0;
      (function send(){
        var recs=part.map(function(x){return{name:x.name,class_label:x.class_label,ref:gen(10),code:gen(12)};});
        sb.from("registry_students").insert(recs).then(function(r){
          if(r.error){
            if(r.error.code==="23505"&&tries++<3){send();return;}   /* collision de code, quasi impossible : on retire au sort */
            document.getElementById("add").disabled=false;load();setTimeout(function(){say(fail(r.error));},400);return;
          }
          chunk(a+200);
        },function(){document.getElementById("add").disabled=false;say("Pas d’internet.");});
      })();
    })(0);
  }

  /* Reprise des classes du compte : un dossier (code + référence) par élève, sans doublon nom+classe */
  function importMine(){
    var btn=document.getElementById("imp");btn.disabled=true;say("Lecture de vos classes…");
    sb.from("classes").select("id,name,students,th").then(function(r){
      if(r.error){btn.disabled=false;say(fail(r.error));return;}
      var have={},list=[],dup=0;
      rows.forEach(function(x){have[nrm(x.name)+"|"+nrm(x.class_label||"")]=1;});
      (r.data||[]).forEach(function(c){
        if(c.th&&c.th.ar)return;
        (c.students||[]).forEach(function(st){
          if(!st||!st.name)return;
          var k=nrm(st.name)+"|"+nrm(c.name||"");
          if(have[k]){dup++;return;}
          have[k]=1;list.push({name:String(st.name).slice(0,120),class_label:String(c.name||"").slice(0,80),phone:String(st.p||"").slice(0,30)});
        });
      });
      if(!list.length){btn.disabled=false;say(dup?"Tous vos élèves ont déjà un dossier ("+dup+").":"Aucun élève trouvé dans les classes de ce compte.");return;}
      if(!confirm(list.length+" élève"+(list.length>1?"s":"")+" recevront un code"+(dup?" ("+dup+" déjà existant"+(dup>1?"s":"")+")":"")+". Continuer ?")){btn.disabled=false;say("");return;}
      say("Attribution des codes…");
      (function chunk(a){
        if(a>=list.length){load();return;}
        var part=list.slice(a,a+200),tries=0;
        (function send(){
          var recs=part.map(function(x){return{name:x.name,class_label:x.class_label,phone:x.phone,ref:gen(10),code:gen(12)};});
          sb.from("registry_students").insert(recs).then(function(w){
            if(w.error){if(w.error.code==="23505"&&tries++<3){send();return;}load();setTimeout(function(){say(fail(w.error));},400);return;}
            chunk(a+200);
          },function(){btn.disabled=false;say("Pas d’internet.");});
        })();
      })(0);
    },function(){btn.disabled=false;say("Pas d’internet.");});
  }

  if(!sb){app.innerHTML='<div style="text-align:center;padding:40px 10px"><h1>Indisponible</h1><p class="sub">La connexion au serveur n’est pas configurée.</p></div>';return;}
  sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    if(s){me=s.user;guard();}else login();
  },function(){login("Pas d’internet.");});
})();
</script>
