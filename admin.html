<style>
:root{--bg:#f2f5f9;--surface:#fff;--ink:#16202e;--mute:#5d6b7e;--line:#d9e0ea;--p:#1f7a4d;--a:#b42b3a;--accent:#1E3F8A;--soft:#e6ecf8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1424;--surface:#192232;--ink:#e8edf5;--mute:#9aa8bc;--line:#2b3850;--p:#5fd08e;--a:#ff8591;--accent:#8fb0f5;--soft:#22304a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 2px}h2{font-size:1.05rem;margin:0 0 8px}
.sub{color:var(--mute);font-size:.9rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;min-height:42px;background:var(--accent);color:var(--bg);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.warn{background:var(--soft);color:var(--a)}
.btn:disabled{opacity:.5;cursor:default}
.bs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.st{border-top:1px solid var(--line);padding:12px 0}
.st:first-of-type{border-top:0}
.st b{font-size:1.02rem}
.cd{font:700 1.05rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--soft);border-radius:8px;padding:6px 10px;display:inline-block;margin:6px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0 4px}
.tile{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;cursor:pointer;box-shadow:0 2px 8px rgba(10,18,34,.07)}
.tile .tn{font-size:1.25rem;font-weight:800;color:var(--accent)}
.stc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(10,18,34,.07)}
.cdb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.lvl{margin:18px 0 4px;font-size:1.02rem}
details.card .card{border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 4px;margin:12px 0 0}
.st .bs .btn,.stc .bs .btn{padding:7px 11px;min-height:38px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:10px 0 4px}
.kpi{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:1.35rem;line-height:1.15}.kpi span{font-size:.74rem;color:var(--mute)}
.dh{font-size:.98rem;margin:16px 0 4px}
.rtk{display:flex;align-items:center;gap:10px;margin:8px 0}.rtk input{width:20px;height:20px;flex:none}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-top:1px solid var(--line);padding:9px 0}
.dr:first-of-type{border-top:0}.dr small{display:block;color:var(--mute);font-size:.82rem}
button.dr{cursor:pointer}
.tg{border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--accent)}
.tg.bad{background:rgba(180,43,58,.14);color:var(--a)}.tg.ok{background:rgba(31,122,77,.14);color:var(--p)}
.tb2{display:flex;gap:6px;overflow-x:auto;margin:6px 0 8px;padding-bottom:2px}
.tb2 .btn{flex:0 0 auto;min-height:38px;padding:7px 13px;font-size:.9rem}
.pb{height:6px;border-radius:9px;background:var(--soft);margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--accent);border-radius:9px}
#msg{min-height:1.3em;margin:8px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#pr{display:none}
.dd summary{cursor:pointer;font-weight:700;margin:8px 0 2px}
.al{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;padding:8px 10px;border-radius:12px;background:rgba(180,43,58,.1)}.al b{color:var(--a);margin-right:4px}.al .btn{min-height:34px;padding:5px 10px;font-size:.85rem}
.rp{color:#000;background:#fff;font:9pt/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}.rp h2{font-size:14pt;margin:0 0 1.5mm;color:#000}.rp h3{font-size:10.5pt;margin:5mm 0 1.5mm;color:#000}.rp p{margin:0 0 2mm;color:#000}
.rpt{width:100%;border-collapse:collapse;font-size:7.5pt;margin-bottom:3mm;color:#000}.rpt th,.rpt td{border:1px solid #888;padding:1.1mm 1.5mm;text-align:left;vertical-align:top}.rpt th{background:#e6ecf8}.rpt tr{break-inside:avoid}
.sig{display:flex;justify-content:space-between;gap:12mm;margin-top:16mm;font-size:9pt}.sig span{border-top:1px solid #000;padding-top:1mm;min-width:60mm}
.cards-grid{font-size:0}
.card-p{border:1px dashed #555;border-radius:4mm;padding:4mm;display:inline-flex;width:calc(50% - 4mm);margin:0 4mm 6mm 0;vertical-align:top;gap:4mm;align-items:center;break-inside:avoid;page-break-inside:avoid;color:#000;background:#fff;font-size:10pt;box-sizing:border-box}
.cp-t{position:absolute;width:1px;height:1px;overflow:hidden}
.cp-q svg{width:34mm;height:34mm;display:block}
.cp-c{font:700 13pt ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;margin:2mm 0}
.cp-i small{display:block;font-size:8pt;color:#333}
@media print{body{background:#fff}main>*:not(#pr){display:none!important}#pr{display:block}@page{size:A4;margin:10mm}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;padding:14px 8px}.kpis b{font-size:1.4rem;display:block}.kpis span{font-size:.75rem;color:var(--mute,#667)}
.flt{display:flex;gap:8px;margin:0 0 12px}.flt button{flex:1;min-height:44px;padding:0 6px;border:1.5px solid var(--line,#d6deea);border-radius:999px;background:var(--surface,#fff);color:inherit;font:inherit;font-weight:700;font-size:.8rem}.flt button[aria-pressed=true]{background:#14275C;border-color:#14275C;color:#fff}
</style>

<body>
<main id="app"><p class="sub" style="text-align:center;margin-top:40px">Chargement…</p></main>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase.js"></script>
<script>
/* Administration du site : réservée aux administrateurs de Classe Master (table plateforme_admins, vérifiée par le serveur).
   Aucun lien de l'application ne mène ici : on tape l'adresse de cette page. Pour tout autre compte, la page ne montre rien.
   Les classes, les élèves et les salles des établissements ne sont jamais renvoyés par le serveur à cette page. */
(function(){
  var app=document.getElementById("app"),me=null,L=null,U=null,C=null,vue="etab",od=null,CODES={},filt="tous",qtxt="",busy=false;
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function say(t){var e=document.getElementById("msg");if(e)e.textContent=t||"";}
  function frErr(e){var m=String((e&&e.message)||e||"").toLowerCase(),st=e&&e.status;
    if(navigator.onLine===false||st===0||/failed to fetch|networkerror|load failed|network request/.test(m))return"pas de connexion internet";
    if(st===401||/jwt|not authenticated|invalid token/.test(m))return"votre session a expiré, reconnectez-vous";
    if(/not allowed|permission denied|row-level security/.test(m))return"action réservée à l’administrateur du site";
    if(/does not exist|could not find the|schema cache/.test(m))return"élément absent côté serveur (exécutez validation-etablissements-v63.sql, validation-reversible-v70.sql puis aide-chefs-v72.sql puis contact-v73.sql)";
    return"erreur inattendue";}
  function notFound(){app.innerHTML='<div style="text-align:center;padding:60px 10px"><h1>Page introuvable</h1><p class="sub"><a href="index.html">Retour à l’accueil</a></p></div>';}
  function login(note){
    app.innerHTML='<h1>Administration du site</h1><p class="sub">Classe Master</p><div class="card"><h2>Connexion</h2><label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><div class="bar"><button class="btn" id="in">Se connecter</button></div><p class="sub" id="msg" role="status">'+esc(note||"")+'</p></div>';
    function go(){
      var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;
      if(!em||!pw){say("Entrez l’e-mail et le mot de passe.");return;}
      say("Connexion…");
      sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
        if(r.error||!r.data||!r.data.session){say(r.error&&r.error.code!=="invalid_credentials"?"Échec de la connexion : "+frErr(r.error):"E-mail ou mot de passe incorrect.");return;}
        me=r.data.session.user;guard();
      },function(){say("Pas d’internet.");});
    }
    document.getElementById("in").onclick=go;
    document.getElementById("pw").onkeydown=function(e){if(e.key==="Enter")go();};
  }
  function guard(){
    sb.rpc("est_admin_plateforme").then(function(r){
      if(r.error||r.data!==true){notFound();return;}
      load();
    },function(){login("Pas d’internet.");});
  }
  function load(){
    sb.rpc("sa_etablissements",{p_statut:null}).then(function(r){
      if(r.error){L=[];U=null;main("Échec : "+frErr(r.error));return;}
      L=Array.isArray(r.data)?r.data:[];
      sb.rpc("sa_usage").then(function(u){U=(u.error||!u.data)?null:u.data;},function(){U=null;}).then(function(){
        return sb.rpc("sa_contact_liste",{p_statut:null}).then(function(c){C=(c.error||!Array.isArray(c.data))?null:c.data;},function(){C=null;});
      }).then(function(){main("");});
    },function(){L=[];U=null;C=null;main("Pas d’internet.");});
  }
  function cnt(st){return(L||[]).filter(function(x){return!st||x.statut===st;}).length;}
  function fd(v){return v?new Date(v).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"";}
  function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
  /* Doublons : même nom et même ville (accents, majuscules et ponctuation ignorés) */
  function dupes(){var m={},d={};(L||[]).forEach(function(x){var k=norm(x.nom)+"|"+norm(x.ville);(m[k]=m[k]||[]).push(x.id);});
    Object.keys(m).forEach(function(k){if(m[k].length>1)m[k].forEach(function(i){d[i]=true;});});return d;}
  function um(){var m={};((U&&U.par_etab)||[]).forEach(function(e){m[e.id]=e;});return m;}
  function fcode(c){c=String(c||"");return c.length===8?c.slice(0,4)+"-"+c.slice(4):c;}
  function saErr(r){
    if(r.error)return frErr(r.error);
    var e=r.data&&r.data.err;
    return({unknown_user:"aucun compte avec cette adresse (la personne doit d’abord créer son compte dans l’application)",bad_email:"adresse e-mail invalide",
      not_valid:"seul un établissement validé a un code d’accès",not_found:"établissement introuvable : actualisez",not_allowed:"action réservée à l’administrateur du site",bad_input:"message vide ou trop long (2 000 caractères au plus)"})[e]||"action impossible (actualisez)";}
  var LAB={valide:"Validé",refuse:"Refusé",suspendu:"Suspendu",en_attente:"En attente"};
  function row(x,dup){
    var st=x.statut,lab=LAB[st]||"En attente",ue=um()[x.id],
        chefs=(x.chefs||[]).map(function(c){return esc(c.nom||c.email)+(c.nom&&c.email?" ("+esc(c.email)+")":"");}).join(", ")||"—",
        d=fd(x.cree),dec=x.decide_le?fd(x.decide_le):"",
        btn="";
    if(st==="en_attente")btn='<button class="btn" data-sav="'+esc(x.id)+'">Valider</button><button class="btn ghost" data-sar="'+esc(x.id)+'">Refuser</button>';
    else if(st==="refuse")btn='<button class="btn" data-sav="'+esc(x.id)+'">Valider</button>';
    else if(st==="valide")btn='<button class="btn warn" data-sas="'+esc(x.id)+'">Suspendre</button><button class="btn ghost" data-snc="'+esc(x.id)+'">Nouveau code</button><button class="btn ghost" data-sch="'+esc(x.id)+'">Changer de chef</button>';
    else if(st==="suspendu")btn='<button class="btn" data-sav="'+esc(x.id)+'">Réactiver</button><button class="btn ghost" data-sch="'+esc(x.id)+'">Changer de chef</button>';
    return'<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="min-width:0"><b>'+esc(x.nom)+'</b>'+(x.ville?" · "+esc(x.ville):"")+'</div><span class="sub" style="margin:0;white-space:nowrap"><b>'+lab+'</b></span></div>'+
      (dup?'<p class="sub" style="margin:6px 0 0;color:var(--a)"><b>Doublon possible</b> : un autre établissement porte le même nom dans la même ville.</p>':"")+
      '<p class="sub" style="margin:6px 0 0">Responsable'+((x.chefs||[]).length>1?"s":"")+" : "+chefs+'</p>'+
      '<p class="sub" style="margin:2px 0 0">'+(x.enseignants||0)+" enseignant"+((x.enseignants||0)>1?"s":"")+(d?" · créé le "+esc(d):"")+'</p>'+
      (dec&&st!=="en_attente"?'<p class="sub" style="margin:2px 0 0">'+(st==="valide"?"Validé":st==="refuse"?"Refusé":"Suspendu")+" le "+esc(dec)+(x.decide_par_email?" par "+esc(x.decide_par_email):"")+'</p>':"")+
      ((st==="valide"||st==="suspendu")&&ue?'<p class="sub" style="margin:2px 0 0">'+(ue.derniere_activite?"Dernière activité : "+esc(fd(ue.derniere_activite)):"Aucune activité enregistrée")+'</p>':"")+
      (CODES[x.id]&&st==="valide"?'<div class="cdb"><span class="cd">'+esc(fcode(CODES[x.id]))+'</span></div><p class="sub" style="margin:0">Nouveau code : transmettez-le au chef. L’ancien code ne fonctionne plus.</p>':"")+
      ((st==="refuse"||st==="suspendu")&&x.motif?'<p class="sub" style="margin:2px 0 0">Motif : '+esc(x.motif)+'</p>':"")+
      (btn?'<div class="bar" style="margin-top:10px">'+btn+'</div>':"")+'</div>';
  }
  function listHtml(){
    var dp=dupes(),q=norm(qtxt),
        rows=(L||[]).filter(function(x){return(filt==="tous"||x.statut===filt)&&(!q||norm(x.nom+" "+x.ville).indexOf(q)>=0);});
    return(rows.length?rows.map(function(x){return row(x,dp[x.id]);}).join(""):'<div class="card"><p class="sub" style="margin:0">Aucun établissement dans cette liste.</p></div>');
  }
  var CATL={question:"Question",probleme:"Problème",code:"Code d’accès",etablissement:"Établissement",autre:"Autre"};
  function nmsg(){return(C||[]).filter(function(d){return d.non_lu;}).length;}
  function tabs(){
    return'<div class="flt" role="group" aria-label="Rubrique">'+[["etab","Établissements"],["msg","Demandes"+(nmsg()?" ("+nmsg()+")":"")]].map(function(c){return'<button type="button" data-v="'+c[0]+'" aria-pressed="'+(vue===c[0])+'">'+esc(c[1])+"</button>";}).join("")+"</div>";
  }
  function demCard(d){
    var th=(d.echanges||[]).map(function(e){return'<div style="border-radius:12px;padding:8px 11px;margin:8px 0;background:'+(e.de_admin?"rgba(31,122,77,.13);margin-left:auto":"var(--soft)")+';max-width:92%"><small class="sub" style="display:block">'+(e.de_admin?"Vous (administrateur)":esc(d.de_nom||d.de_email))+" · "+esc(fdt(e.created_at))+'</small><p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(e.corps)+'</p></div>';}).join("");
    return'<details class="card" data-did="'+esc(d.id)+'"'+(od===d.id?" open":"")+'><summary style="cursor:pointer"><b>'+esc(d.sujet)+'</b> '+(d.non_lu?'<span class="tg ok">Nouveau</span> ':"")+(d.statut==="traite"?'<span class="tg">Traitée</span>':"")+
      '<br><span class="sub">'+esc(d.de_nom||"")+(d.de_nom?" · ":"")+esc(d.de_email)+(d.role?" · "+(d.role==="admin"?"chef":"enseignant"):"")+(d.etab_nom?" · "+esc(d.etab_nom)+(d.etab_ville?" ("+esc(d.etab_ville)+")":""):"")+" · "+esc(CATL[d.categorie]||"Autre")+" · "+esc(fdt(d.maj_le))+'</span></summary>'+th+
      '<label for="dr-'+esc(d.id)+'">Votre réponse</label><textarea id="dr-'+esc(d.id)+'" maxlength="2000"></textarea>'+
      '<div class="bar"><button class="btn" data-dr="'+esc(d.id)+'">Répondre</button><button class="btn ghost" data-drc="'+esc(d.id)+'">Répondre et clore</button><button class="btn ghost" data-dst="'+esc(d.id)+'">'+(d.statut==="traite"?"Rouvrir":"Clore sans répondre")+'</button></div></details>';
  }
  function fdt(v){return v?new Date(v).toLocaleString("fr-FR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"";}
  function mainMsg(note){
    app.innerHTML='<h1>Administration du site</h1><p class="sub">'+esc((me&&me.email)||"")+' · Les demandes des chefs d’établissement et des enseignants. L’expéditeur ne voit jamais votre adresse : il lit « Administrateur Classe Master ».</p>'+tabs()+
      (C===null?'<div class="card"><p class="sub" style="margin:0">Messagerie indisponible : exécutez supabase/contact-v73.sql.</p></div>':
        C.length?C.map(demCard).join(""):'<div class="card"><p class="sub" style="margin:0">Aucune demande.</p></div>')+
      '<div class="bar"><button class="btn ghost" id="rf">Actualiser</button><button class="btn ghost" id="out">Se déconnecter</button></div><p class="sub" id="msg" role="status">'+esc(note||"")+"</p>";
  }
  function main(note){if(vue==="msg")mainMsg(note);else mainEtab(note);}
  function mainEtab(note){
    var nd=Object.keys(dupes()).length;
    app.innerHTML='<h1>Administration du site</h1><p class="sub">'+esc((me&&me.email)||"")+' · Les établissements inscrits, leurs responsables et leur validation. Les classes, les élèves et les salles restent privés : seul le chef de chaque établissement y a accès.</p>'+tabs()+
      '<div class="card kpis">'+[["Total",cnt()],["Validés",cnt("valide")],["En attente",cnt("en_attente")],["Refusés",cnt("refuse")+cnt("suspendu")]].map(function(c){return"<div><b>"+c[1]+"</b><span>"+c[0]+"</span></div>";}).join("")+'</div>'+
      (U?'<div class="card kpis" style="grid-template-columns:repeat(3,1fr)">'+[["Actifs (30 jours)",U.actifs_30j],["Sans activité (30 jours)",U.inactifs_30j],["Enseignants",U.enseignants]].map(function(c){return"<div><b>"+(c[1]==null?0:c[1])+"</b><span>"+c[0]+"</span></div>";}).join("")+'</div><p class="sub" style="margin:-6px 0 10px">Chiffres anonymes, établissements validés : jamais de nom d’élève ni de note.</p>':'<p class="sub" style="margin:0 0 10px">Chiffres d’usage indisponibles : exécutez supabase/aide-chefs-v72.sql.</p>')+
      '<div class="flt" role="group" aria-label="Filtrer">'+[["tous","Tous"],["en_attente","En attente"],["valide","Validés"],["suspendu","Suspendus"],["refuse","Refusés"]].map(function(c){return'<button type="button" data-f="'+c[0]+'" aria-pressed="'+(filt===c[0])+'">'+c[1]+"</button>";}).join("")+"</div>"+
      '<label for="sq">Rechercher un établissement (nom ou ville)</label><input id="sq" type="search" autocomplete="off" value="'+esc(qtxt)+'" placeholder="ex. Nsou" style="margin-bottom:12px">'+
      (nd?'<p class="sub" style="margin:0 0 8px">'+nd+' établissement'+(nd>1?"s":"")+' avec un doublon possible (même nom, même ville).</p>':"")+
      '<div id="lst">'+listHtml()+'</div>'+
      '<div class="bar"><button class="btn ghost" id="rf">Actualiser</button><button class="btn ghost" id="out">Se déconnecter</button></div><p class="sub" id="msg" role="status">'+esc(note||"")+"</p>";
  }
  app.addEventListener("toggle",function(ev){
    var d=ev.target;if(!d||!d.matches||!d.matches("details[data-did]"))return;
    var id=d.getAttribute("data-did"),x=(C||[]).filter(function(e){return e.id===id;})[0];
    if(d.open){od=id;if(x&&x.non_lu){x.non_lu=false;sb.rpc("sa_contact_statut",{p_id:id,p_statut:null}).then(function(){},function(){});var t=d.querySelector(".tg.ok");if(t)t.remove();}}
    else if(od===id)od=null;
  },true);
  app.addEventListener("input",function(ev){
    if(ev.target&&ev.target.id==="sq"){qtxt=ev.target.value;var l=document.getElementById("lst");if(l)l.innerHTML=listHtml();}
  });
  app.addEventListener("click",function(ev){
    var b=ev.target.closest?ev.target.closest("button"):null;if(!b)return;
    if(b.dataset.f){filt=b.dataset.f;main("");return;}
    if(b.dataset.v){vue=b.dataset.v;main("");return;}
    if(b.dataset.dr||b.dataset.drc||b.dataset.dst){
      if(busy)return;
      var did=b.dataset.dr||b.dataset.drc||b.dataset.dst,ta=document.getElementById("dr-"+did),tx=ta?ta.value.trim():"",dd=(C||[]).filter(function(e){return e.id===did;})[0],q;
      if(b.dataset.dst){q=sb.rpc("sa_contact_statut",{p_id:did,p_statut:dd&&dd.statut==="traite"?"ouvert":"traite"});}
      else{if(!tx){say("Écrivez une réponse.");return;}q=sb.rpc("sa_contact_repondre",{p_id:did,p_corps:tx,p_clore:!!b.dataset.drc});}
      busy=true;
      q.then(function(r){
        busy=false;
        if(r.error||!r.data||r.data.ok!==true){say("Échec : "+saErr(r));return;}
        od=did;load();
      },function(){busy=false;say("Pas d’internet.");});
      return;
    }
    if(b.id==="rf"){load();return;}
    if(b.id==="out"){sb.auth.signOut().then(function(){me=null;L=null;login("Déconnecté.");});return;}
    if(b.dataset.snc){
      if(busy)return;
      var ie=b.dataset.snc,xe=(L||[]).filter(function(e){return e.id===ie;})[0];
      if(!confirm("Générer un nouveau code d’accès pour « "+(xe?xe.nom:"")+" » ? L’ancien code cesse de fonctionner ; les enseignants déjà inscrits restent membres. Vous devrez transmettre le nouveau code au chef."))return;
      busy=true;
      sb.rpc("sa_nouveau_code",{p_etab:ie}).then(function(r){
        busy=false;
        if(r.error||!r.data||r.data.ok!==true){say("Échec : "+saErr(r));return;}
        CODES[ie]=r.data.code;main("Nouveau code généré.");
      },function(){busy=false;say("Pas d’internet.");});
      return;
    }
    if(b.dataset.sch){
      if(busy)return;
      var ic=b.dataset.sch,xc=(L||[]).filter(function(e){return e.id===ic;})[0],nm=xc?xc.nom:"",
          em=prompt("Adresse e-mail du nouveau chef de « "+nm+" » (la personne doit déjà avoir un compte Classe Master) :","");
      if(em===null)return;em=em.trim();if(!em)return;
      if(!confirm("Nommer "+em+" chef d’établissement de « "+nm+" » ?"))return;
      var rp=confirm("Retirer les droits de chef aux responsables actuels ?\n\nOK : ils redeviennent simples enseignants (cas d’un chef parti).\nAnnuler : ils restent chefs, le nouveau s’ajoute.");
      busy=true;
      sb.rpc("sa_definir_chef",{p_etab:ic,p_email:em,p_remplacer:rp}).then(function(r){
        busy=false;
        if(r.error||!r.data||r.data.ok!==true){say("Échec : "+saErr(r));return;}
        load();
      },function(){busy=false;say("Pas d’internet.");});
      return;
    }
    if(b.dataset.sav||b.dataset.sar||b.dataset.sas){
      if(busy)return;
      var id=b.dataset.sav||b.dataset.sar||b.dataset.sas,x=(L||[]).filter(function(e){return e.id===id;})[0],cur=x?x.statut:"",st,mot="";
      if(b.dataset.sas){
        mot=prompt("Motif de la suspension (visible par le chef d’établissement, facultatif). Son tableau de bord et son code seront bloqués ; les enseignants gardent leurs classes.","");if(mot===null)return;st="suspendu";
      }else if(b.dataset.sar){
        mot=prompt("Motif du refus (visible par le demandeur, facultatif)","");if(mot===null)return;st="refuse";
      }else{
        if(!confirm(cur==="suspendu"?"Réactiver cet établissement ? Son chef retrouve l’accès au tableau de bord et au code des enseignants.":"Valider cet établissement ? Son chef d’établissement aura accès au tableau de bord et au code des enseignants."))return;
        st="valide";
      }
      busy=true;
      sb.rpc("sa_changer_statut",{p_etab:id,p_statut:st,p_motif:mot}).then(function(r){
        busy=false;
        if(r.error||(r.data&&r.data.ok===false)){say("Échec : "+(r.error?frErr(r.error):"action impossible (l’établissement a peut-être déjà changé d’état : actualisez)."));return;}
        load();
      },function(){busy=false;say("Pas d’internet.");});
    }
  });
  if(!sb){app.innerHTML='<div style="text-align:center;padding:40px 10px"><h1>Indisponible</h1><p class="sub">La connexion au serveur n’est pas configurée.</p></div>';return;}
  sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    if(s){me=s.user;guard();}else login();
  },function(){login("Pas d’internet.");});
})();
</script>
</body>
</html>
