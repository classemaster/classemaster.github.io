<style>
:root{--bg:#f2f5f9;--surface:#fff;--ink:#16202e;--mute:#5d6b7e;--line:#d9e0ea;--p:#1f7a4d;--a:#b42b3a;--accent:#1E3F8A;--soft:#e6ecf8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1424;--surface:#192232;--ink:#e8edf5;--mute:#9aa8bc;--line:#2b3850;--p:#5fd08e;--a:#ff8591;--accent:#8fb0f5;--soft:#22304a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 2px}h2{font-size:1.05rem;margin:0 0 8px}
.sub{color:var(--mute);font-size:.9rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;min-height:42px;background:var(--accent);color:var(--bg);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.warn{background:var(--soft);color:var(--a)}
.btn:disabled{opacity:.5;cursor:default}
.bs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.st{border-top:1px solid var(--line);padding:12px 0}
.st:first-of-type{border-top:0}
.st b{font-size:1.02rem}
.cd{font:700 1.05rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--soft);border-radius:8px;padding:6px 10px;display:inline-block;margin:6px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0 4px}
.tile{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;cursor:pointer;box-shadow:0 2px 8px rgba(10,18,34,.07)}
.tile .tn{font-size:1.25rem;font-weight:800;color:var(--accent)}
.stc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(10,18,34,.07)}
.cdb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.lvl{margin:18px 0 4px;font-size:1.02rem}
details.card .card{border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 4px;margin:12px 0 0}
.st .bs .btn,.stc .bs .btn{padding:7px 11px;min-height:38px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:10px 0 4px}
.kpi{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:1.35rem;line-height:1.15}.kpi span{font-size:.74rem;color:var(--mute)}
.dh{font-size:.98rem;margin:16px 0 4px}
.rtk{display:flex;align-items:center;gap:10px;margin:8px 0}.rtk input{width:20px;height:20px;flex:none}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-top:1px solid var(--line);padding:9px 0}
.dr:first-of-type{border-top:0}.dr small{display:block;color:var(--mute);font-size:.82rem}
button.dr{cursor:pointer}
.tg{border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--accent)}
.tg.bad{background:rgba(180,43,58,.14);color:var(--a)}.tg.ok{background:rgba(31,122,77,.14);color:var(--p)}
.tb2{display:flex;gap:6px;overflow-x:auto;margin:6px 0 8px;padding-bottom:2px}
.tb2 .btn{flex:0 0 auto;min-height:38px;padding:7px 13px;font-size:.9rem}
.pb{height:6px;border-radius:9px;background:var(--soft);margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--accent);border-radius:9px}
#msg{min-height:1.3em;margin:8px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#pr{display:none}
.dd summary{cursor:pointer;font-weight:700;margin:8px 0 2px}
.al{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;padding:8px 10px;border-radius:12px;background:rgba(180,43,58,.1)}.al b{color:var(--a);margin-right:4px}.al .btn{min-height:34px;padding:5px 10px;font-size:.85rem}
.rp{color:#000;background:#fff;font:9pt/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}.rp h2{font-size:14pt;margin:0 0 1.5mm;color:#000}.rp h3{font-size:10.5pt;margin:5mm 0 1.5mm;color:#000}.rp p{margin:0 0 2mm;color:#000}
.rpt{width:100%;border-collapse:collapse;font-size:7.5pt;margin-bottom:3mm;color:#000}.rpt th,.rpt td{border:1px solid #888;padding:1.1mm 1.5mm;text-align:left;vertical-align:top}.rpt th{background:#e6ecf8}.rpt tr{break-inside:avoid}
.sig{display:flex;justify-content:space-between;gap:12mm;margin-top:16mm;font-size:9pt}.sig span{border-top:1px solid #000;padding-top:1mm;min-width:60mm}
.cards-grid{font-size:0}
.card-p{border:1px dashed #555;border-radius:4mm;padding:4mm;display:inline-flex;width:calc(50% - 4mm);margin:0 4mm 6mm 0;vertical-align:top;gap:4mm;align-items:center;break-inside:avoid;page-break-inside:avoid;color:#000;background:#fff;font-size:10pt;box-sizing:border-box}
.cp-t{position:absolute;width:1px;height:1px;overflow:hidden}
.cp-q svg{width:34mm;height:34mm;display:block}
.cp-c{font:700 13pt ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;margin:2mm 0}
.cp-i small{display:block;font-size:8pt;color:#333}
@media print{body{background:#fff}main>*:not(#pr){display:none!important}#pr{display:block}@page{size:A4;margin:10mm}}
</style>

</head>
<body>
<main id="app"><p class="sub" style="text-align:center;margin-top:40px">Chargement…</p></main>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/qr.js"></script>
<script src="js/telecharger.js"></script>
<script src="js/niveaux.js"></script>
<script>
(function(){
  var app=document.getElementById("app"),AL="ABCDEFGHJKMNPQRSTUVWXYZ23456789",rows=[],filt="",shown={},me=null,asg=[],qtxt="",lim=50,ed={},curC=null,dash=null,mov=null,dtab="apercu",tch=null,dsc=null,dec=null;
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function nrm(x){return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
  /* Aléatoire de qualité cryptographique, sans O/0/I/1/L ; 248 = 31×8 : pas de biais */
  function gen(n){var o="",a=new Uint8Array(32),i;while(o.length<n){crypto.getRandomValues(a);for(i=0;i<a.length&&o.length<n;i++)if(a[i]<248)o+=AL.charAt(a[i]%31);}return o;}
  function fmt(k){return String(k).replace(/(.{4})(?=.)/g,"$1-");}
  function link(code){return new URL("parent.html?c="+encodeURIComponent(code),location.href).href;}
  function intl(v){var d=String(v||"").replace(/[^\d+]/g,""),plus=d.charAt(0)==="+";d=d.replace(/\D/g,"");if(!d)return"";if(!plus){if(d.slice(0,2)==="00")d=d.slice(2);else if(d.slice(0,3)!=="242"||d.length<11)d="242"+d;}return d.length>=8&&d.length<=15?d:"";}
  function say(t){
    var e=document.getElementById("msg");if(!e)return;
    e.textContent=t;
    /* le message est tout en bas de la page : on l'amène à l'écran pour qu'on le voie */
    if(t){e.style.cssText="position:sticky;bottom:12px;z-index:30;background:var(--surface,#fff);border:1px solid var(--line,#d6deea);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(10,18,34,.18);font-weight:600";try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(x){}}
    else e.style.cssText="";
  }
  function frErr(e){var m=String((e&&e.message)||e||"").toLowerCase(),c=String((e&&e.code)||""),st=e&&e.status;
    if(navigator.onLine===false||st===0||/failed to fetch|networkerror|load failed|network request/.test(m))return"pas de connexion internet";
    if(st===401||c==="PGRST301"||/jwt|not authenticated|invalid token/.test(m))return"votre session a expiré, reconnectez-vous";
    if(c==="42501"||/row-level security|permission denied|violates|not admin/.test(m))return"action réservée à l’administrateur";
    if(st===429||/rate limit|too many/.test(m))return"trop de tentatives, patientez un moment";
    if(c==="23505"||/duplicate key/.test(m))return"cet élément existe déjà";
    if(c==="PGRST202"||c==="42883"||c==="42P01"||/does not exist|could not find the|schema cache/.test(m))return"élément absent côté serveur (installation incomplète)";
    if(st===408||st===504||/timeout|timed out/.test(m))return"le serveur met trop de temps à répondre";
    if(st>=500)return"le service est momentanément indisponible";
    return"erreur inattendue";}
  function fail(e){return"Échec : "+frErr(e)+(/registry_students|relation|schema/i.test((e&&e.message)||"")?" — exécutez d’abord supabase/partage-admin.sql dans Supabase.":"");}
  function download(name,txt,note){cmSave(name,"\ufeff"+txt,"text/csv",function(m){say(m+(note?" "+note:""));});}
  function q(x){return'"'+String(x).replace(/"/g,'""')+'"';}

  /* ---------- Connexion ---------- */
  function login(note){
    app.innerHTML='<h1>Gestion de l’établissement</h1><p class="sub">Dossiers des élèves et liens parents · Classe Master</p><div class="card"><h2>Connexion</h2><label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><div class="bs"><button class="btn" id="in">Se connecter</button></div><p class="sub" id="msg" role="status">'+esc(note||"")+'</p></div><p class="sub">Les codes des élèves ne sont visibles que sur cette page. Gardez ce mot de passe pour vous seul. Pas encore de compte ? Créez-le dans <a href="./">l’application</a> en choisissant « Chef d’établissement ».</p>';
    function go(){
      var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;
      if(!em||!pw){say("Entrez l’e-mail et le mot de passe.");return;}
      say("Connexion…");
      var p=sb.auth.signInWithPassword({email:em,password:pw});
      p.then(function(r){
        if(r.error){say(r.error.code==="invalid_credentials"?"E-mail ou mot de passe incorrect.":"Échec de la connexion : "+frErr(r.error));return;}
        if(!r.data||!r.data.session){say("Connexion impossible : réessayez.");return;}
        me=r.data.session.user;guard();
      },function(){say("Pas d’internet.");});
    }
    document.getElementById("in").onclick=go;
    document.getElementById("pw").onkeydown=function(e){if(e.key==="Enter")go();};
  }


  /* ---------- Établissement : chaque administrateur gère SON établissement (voir supabase/etablissements-v60.sql) ---------- */
  var ET=null,ETS=[],MEM=[],busy=false,TH={moy:10,pres:80,abs:3},MSGS=null,JNL=null,MSGD={c:"enseignants",t:"",b:""},OP={};
  function setTh(){TH.moy=+(ET&&ET.seuil_moy)||10;TH.pres=+(ET&&ET.seuil_pres)||80;TH.abs=+(ET&&ET.seuil_abs)||3;}
  function etabCode(c){c=String(c||"");return c.length===8?c.slice(0,4)+"-"+c.slice(4):c;}
  function ep(o){var r={},k;if(ET)r.p_etab=ET.id;for(k in (o||{}))r[k]=o[k];return r;}   /* paramètres RPC + établissement actif */
  function loadEtab(){
    sb.rpc("mes_etablissements").then(function(r){
      var l=r.error?[]:(Array.isArray(r.data)?r.data:[]);
      ETS=l.filter(function(e){return e.role==="admin";});
      if(!ETS.length){ET=null;load();return;}   /* script des établissements pas encore exécuté : comportement d'avant */
      var sv="";try{sv=localStorage.getItem("cm-admin-etab")||"";}catch(e){}
      ET=ETS.filter(function(e){return e.id===sv;})[0]||ETS[0];setTh();
      sb.rpc("etab_membres_liste",{p_etab:ET.id}).then(function(m){MEM=m.error?[]:(m.data||[]);load();},function(){MEM=[];load();});
    },function(){login("Pas d’internet.");});
  }
  function switchEtab(id){
    var e=ETS.filter(function(x){return x.id===id;})[0];if(!e)return;
    ET=e;setTh();MSGS=null;JNL=null;try{localStorage.setItem("cm-admin-etab",id);}catch(x){}
    rows=[];asg=[];dash=null;mov=null;tch=null;dsc=null;curC=null;main();
    sb.rpc("etab_membres_liste",{p_etab:ET.id}).then(function(m){MEM=m.error?[]:(m.data||[]);load();},function(){MEM=[];load();});
  }
  function memHtml(){
    if(!MEM.length)return"";
    var pend=MEM.filter(function(m){return m.statut==="en_attente";}),L=pend.concat(MEM.filter(function(m){return m.statut!=="en_attente";}));
    return'<p class="sub" style="margin:10px 0 4px">Les nouveaux enseignants doivent être acceptés par vous : <b>'+(ET.valider_enseignants?"oui":"non")+'</b></p><div class="bs" style="margin-top:0"><button class="btn ghost" id="evalid">'+(ET.valider_enseignants?"Ne plus exiger de validation":"Exiger ma validation")+'</button></div>'+
      (pend.length?'<div class="al" role="status"><b>'+pend.length+' demande'+(pend.length>1?"s":"")+' en attente</b> : acceptez ou refusez ci-dessous.</div>':"")+
      '<details class="dd"'+(MEM.length<=8||pend.length?" open":"")+'><summary>Enseignants et administrateurs ('+MEM.length+')</summary>'+L.map(function(m){
      var moi=me&&m.user_id===me.id;
      if(m.statut==="en_attente")return'<div class="st" style="padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="min-width:0"><b>'+esc(m.nom||m.email)+'</b> · <span class="tg bad">en attente</span><br><span class="sub" style="margin:0">'+esc(m.email)+'</span></span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" data-macc="'+esc(m.user_id)+'">Accepter</button><button class="btn warn" data-mref="'+esc(m.user_id)+'">Refuser</button></span></div>';
      return'<div class="st" style="padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="min-width:0"><b>'+esc(m.nom||m.email)+'</b>'+(m.role==="admin"?' · <span class="tg ok">chef</span>':'')+(moi?' · vous':'')+'<br><span class="sub" style="margin:0">'+esc(m.email)+'</span></span>'+
        (moi?'':'<span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ghost" data-mrole="'+esc(m.user_id)+'|'+(m.role==="admin"?"enseignant":"admin")+'">'+(m.role==="admin"?"Retirer chef":"Nommer chef")+'</button><button class="btn warn" data-mrm="'+esc(m.user_id)+'">Retirer</button></span>')+'</div>';
    }).join("")+'</details>';
  }
  function reloadMem(msg){
    sb.rpc("etab_membres_liste",{p_etab:ET.id}).then(function(m){MEM=m.error?MEM:(m.data||[]);main();if(msg)say(msg);},function(){say("Pas d’internet.");});
  }
  function memCall(fn,args,ok){
    if(busy)return;busy=true;
    sb.rpc(fn,args).then(function(r){
      busy=false;
      if(r.error){say(fail(r.error));return;}
      var d=r.data||{};
      if(d.ok===false){say(({last_admin:"Vous êtes le seul chef : nommez d’abord un autre chef.",not_member:"Cet enseignant n’est plus membre, ou sa demande a déjà été traitée.",bad_threshold:"Valeurs hors limites (moyenne 1 à 19, présence 10 à 100 %, absences 1 à 14).",bad_message:"Écrivez un titre (100 caractères max.) et un message (1 000 max.).",too_many_messages:"Limite atteinte : 20 messages par jour.",no_students:"Aucun élève à déplacer.",too_many_students:"Trop d’élèves à la fois (1 000 max.)."})[d.err]||"Action impossible pour le moment.");return;}
      ok(d);
    },function(){busy=false;say("Pas d’internet.");});
  }
  function etabBar(){
    if(!ET)return"";
    var t=MEM.filter(function(m){return m.role!=="admin"&&m.statut!=="en_attente";}).length;
    return'<div class="card"><h2>'+esc(ET.nom)+(ET.ville?" · "+esc(ET.ville):"")+'</h2>'+
      (ETS.length>1?'<label for="esw">Établissement</label><select id="esw">'+ETS.map(function(e){return'<option value="'+esc(e.id)+'"'+(e.id===ET.id?" selected":"")+'>'+esc(e.nom)+'</option>';}).join("")+'</select>':'')+
      '<p class="sub" style="margin:0 0 6px">Code d’accès des enseignants</p><div class="cdb"><span class="cd" id="ecd">'+esc(etabCode(ET.code))+'</span></div>'+
      '<div class="bs"><button class="btn" id="ecp">Copier le code</button><button class="btn ghost" id="enc">Nouveau code</button><button class="btn ghost" id="eop">'+(ET.ouvert===false?"Rouvrir":"Fermer")+' les inscriptions</button></div>'+
      '<p class="sub" style="margin:8px 0 0">'+t+' enseignant'+(t>1?"s":"")+' inscrit'+(t>1?"s":"")+(ET.ouvert===false?" · inscriptions fermées":"")+'. Chaque enseignant s’inscrit dans l’application avec ce code ; vous lui affectez ensuite ses élèves dans « Gestion ».</p>'+
      '<div class="bs"><button class="btn ghost" id="eren">Renommer l’établissement</button></div>'+memHtml()+'</div>';
  }
  app.addEventListener("click",function(e){
    var b=e.target.closest?e.target.closest("button"):null;if(!b||!ET)return;
    if(b.id==="ecp"){
      var tx=etabCode(ET.code);
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(function(){say("Code copié : "+tx);},function(){say("Code : "+tx);});
      else say("Code : "+tx);
    }else if(b.id==="enc"){
      if(!confirm("Créer un nouveau code ? L’ancien ne fonctionnera plus ; les enseignants déjà inscrits restent membres."))return;
      sb.rpc("etab_nouveau_code",{p_etab:ET.id}).then(function(r){if(r.error||!r.data||r.data.ok===false){say(fail(r.error||{}));return;}ET.code=r.data.code;main();say("Nouveau code : "+etabCode(ET.code));},function(){say("Pas d’internet.");});
    }else if(b.id==="eren"){
      var nn=prompt("Nom de l’établissement",ET.nom);if(nn===null)return;
      var vv=prompt("Ville (facultatif)",ET.ville||"");if(vv===null)return;
      memCall("etab_renommer",{p_etab:ET.id,p_nom:nn,p_ville:vv},function(){ET.nom=nn.trim();ET.ville=vv.trim().slice(0,80);main();say("Établissement renommé.");});
    }else if(b.dataset.mrm){
      var mm=MEM.filter(function(x){return x.user_id===b.dataset.mrm;})[0];
      if(!confirm("Retirer "+((mm&&(mm.nom||mm.email))||"cet enseignant")+" de l’établissement ? Ses affectations d’élèves seront retirées."))return;
      memCall("etab_retirer",{p_etab:ET.id,p_user:b.dataset.mrm},function(){reloadMem("Enseignant retiré.");loadAsg();});
    }else if(b.dataset.mrole){
      var ar=b.dataset.mrole.split("|");
      if(ar[1]==="enseignant"&&!confirm("Retirer les droits de chef à cette personne ?"))return;
      memCall("etab_definir_role",{p_etab:ET.id,p_user:ar[0],p_role:ar[1]},function(){reloadMem(ar[1]==="admin"?"Nouveau chef nommé.":"Droits de chef retirés.");});
    }else if(b.id==="eop"){
      var op=ET.ouvert===false;
      sb.rpc("etab_ouvrir",{p_etab:ET.id,p_ouvert:op}).then(function(r){if(r.error){say(fail(r.error));return;}ET.ouvert=op;main();say(op?"Inscriptions rouvertes.":"Inscriptions fermées : le code n’accepte plus de nouveaux enseignants.");},function(){say("Pas d’internet.");});
    }
  });

  /* ---------- Seuils d’alerte, messages, journal (voir supabase/gestion-v71.sql) ---------- */

  /* ---------- Rentrée : élèves au niveau suivant (voir supabase/rentree-v61.sql) ---------- */
  var RTA={open:false,year:"",last3:null,inc:false,dmap:null,list:null,missing:false,loading:false};
  function rtaYears(){var y=+schoolYear().slice(0,4);return[(y-1)+"-"+y,y+"-"+(y+1)];}
  function rtaInit(){
    if(RTA.year)return;
    var ys=rtaYears(),m=new Date().getMonth();   /* de septembre à décembre, la rentrée porte sur l’année qui vient de finir */
    RTA.year=(m>=8&&m<=11)?ys[0]:ys[1];

  function rtaLoad(){
    if(!ET||RTA.loading)return;

    Promise.all([
      sb.from("registry_decisions").select("student_id,decision").eq("year",yr).range(0,4999),
      sb.rpc("rentrees_liste",{p_etab:ET.id})
    ]).then(function(a){
      RTA.loading=false;
      if(yr!==RTA.year){rtaLoad();return;}
      var m={};(a[0].data||[]).forEach(function(d){m[d.student_id]=d.decision;});
      RTA.dmap=m;RTA.missing=!!a[1].error;RTA.list=a[1].error?[]:(a[1].data||[]);
      main();
    },function(){RTA.loading=false;});
  }
  function rtaPlan(M){
    var by={},plan={moves:[],unknown:[],movers:0,stay:0,pend:0},lyc=false;
    rows.forEach(function(r){var k=r.class_label||"";(by[k]=by[k]||[]).push(r);if(nivIsLycee(k))lyc=true;});
    if(RTA.last3===null)RTA.last3=!lyc;
    Object.keys(by).sort().forEach(function(k){
      var info=nivNext(k,{last3:RTA.last3}),mv=[],stay=0,pend=0;
      by[k].forEach(function(r){
        var d=RTA.dmap&&RTA.dmap[r.id];
        if(!d&&RTA.inc&&M&&RTA.year===schoolYear()){var f=finDec(M,r.id);d=f&&f.auto;}
        if(d==="p")mv.push(r.id);else if(d==="r")stay++;else pend++;
      });
      if(!info.known){if(k&&!/^Sortis /i.test(k))plan.unknown.push(k);return;}
      plan.stay+=stay;plan.pend+=pend;
      if(!mv.length)return;
      plan.moves.push({from:k,to:info.last?"Sortis "+RTA.year:info.next,ids:mv,n:mv.length,stay:stay,pend:pend,last:info.last});
      plan.movers+=mv.length;
    });
    return plan;
  }

    if(!plan.moves.length)h+='<p class="sub" style="margin:8px 0 0">Aucun élève à faire passer pour '+esc(RTA.year)+' : confirmez d’abord les décisions « passe » ci-dessus.</p>';

      plan.moves.map(function(m){return'<tr><td>'+esc(m.from)+'</td><td>'+esc(m.to)+'</td><td>'+m.n+'</td><td>'+m.stay+'</td><td>'+m.pend+'</td></tr>';}).join("")+'</table></div>';
    if(plan.unknown.length)h+='<p class="sub" style="margin:8px 0 0">Niveau non reconnu (non déplacées) : '+plan.unknown.map(esc).join(", ")+'.</p>';
    if(act)h+='<p class="sub" style="margin:10px 0 6px"><b>Rentrée déjà appliquée</b> ('+act.nb+' élève'+(act.nb>1?"s":"")+').</p><button class="btn ghost" id="rtaundo">Annuler ce passage</button>';
    else if(plan.moves.length)h+='<div class="bs" style="margin-top:10px"><button class="btn" id="rtaapply">Appliquer le passage ('+plan.movers+' élève'+(plan.movers>1?"s":"")+')</button></div>';
    return h+'</div></details>';

  /* Modèle commun : un cumul par élève, par classe, par enseignant et par matière */
  function dmodel(){
    var byId={},S={},T={},C={},SJ={},last="",n0=0,a0=0;
    rows.forEach(function(r){byId[r.id]=r;var k=r.class_label||"";(C[k]=C[k]||{eff:0,fol:0,n:0,a:0,j:0,r:0,m:[],t:[[],[],[]]}).eff++;});

  /* 6. Fin de période */
  function pval(d,p){var v=p==="a"?d.avg:d["t"+p];return v===null||v===undefined?null:+v;}

  /* Bulletins : une matière est complète quand tous les élèves de la classe ont une moyenne pour la période et qu'aucune évaluation n'attend ses notes */
  function bulletins(M,p){
    var G={},C={};
    dash.forEach(function(d){
      var r=M.byId[d.student_id];if(!r)return;
      var k=r.class_label||"",key=k+"|"+(d.teacher||"")+"|"+(d.subj||""),g=G[key]||(G[key]={k:k,t:d.teacher||"",s:d.subj||"—",n:0,late:0});
      if(pval(d,p)!==null)g.n++;
    });
    (Array.isArray(tch)?tch:[]).forEach(function(g){var o=G[(g.class_label||"")+"|"+(g.teacher||"")+"|"+(g.subj||"")];if(o)o.late=evLate(g).length;});
    Object.keys(G).forEach(function(key){
      var g=G[key],eff=M.C[g.k]?M.C[g.k].eff:0,c=C[g.k]||(C[g.k]={k:g.k,eff:eff,ok:0,all:0,bad:[]});

  }

  function etabTable(M){

  /* Niveau d'une classe : « 5e A » et « 5eA » donnent « 5e », « Terminale D » donne « Terminale » */
  function lvl(c){
    c=String(c||"").trim();if(!c)return"Sans classe";
    var t=c.split(/[\s\-_\/]+/)[0],m=t.match(/^(\d{1,2}(?:ème|eme|è|e|ère|ere|er|nde))[A-Za-z]$/i);
    return m?m[1]:t;
  }
  function lvlRank(l){
    var m=l.match(/^(\d{1,2})/);
    if(m)return({6:1,5:2,4:3,3:4,2:5,1:6})[+m[1]]||50+ +m[1];
    if(/^t(erm|le)/i.test(l))return 7;
    return l==="Sans classe"?200:99;
  }

  /* Nouveaux codes pour tous les élèves de la sélection (les anciens liens cessent de fonctionner) */

    var btn=document.getElementById("rotall");btn.disabled=true;say("Création des nouveaux codes…");

      if(a>=V.length){load();setTimeout(function(){say(done+" nouveau"+(done>1?"x":"")+" code"+(done>1?"s":"")+" créé"+(done>1?"s":"")+". Imprimez ou exportez les cartes pour les redistribuer.");},500);return;}
      var part=V.slice(a,a+100),tries=0;
      (function send(){
        var recs=part.map(function(r){return{id:r.id,user_id:me.id,etab_id:r.etab_id||(ET?ET.id:undefined),name:r.name,class_label:r.class_label||"",phone:r.phone||"",ref:r.ref,code:gen(12)};});
        sb.from("registry_students").upsert(recs,{onConflict:"id"}).then(function(w){
          if(w.error){if(w.error.code==="23505"&&tries++<3){send();return;}load();setTimeout(function(){say(fail(w.error)+" ("+done+" code(s) déjà renouvelé(s))");},500);return;}
          done+=part.length;chunk(a+100);
        },function(){btn.disabled=false;say("Pas d’internet ("+done+" code(s) déjà renouvelé(s)).");});
      })();
    })(0);
  }

  /* Création : un code et une référence aléatoires par élève */
  function add(){
    var dc=document.getElementById("dc").value.trim(),txt=document.getElementById("ta").value,have={},list=[],dup=0;
    rows.forEach(function(r){have[nrm(r.name)+"|"+nrm(r.class_label||"")]=1;});
    txt.split(/\r?\n/).forEach(function(l,i){
      var p=l.split(/\t|;/).map(function(x){return x.replace(/^"|"$/g,"").trim();});
      if(!p[0])return;
      if(i===0&&/^(nom|noms|eleve|eleves)$/.test(nrm(p[0])))return;   /* ligne d'en-tête */
      var cls=p[1]||dc,k=nrm(p[0])+"|"+nrm(cls);
      if(have[k]){dup++;return;}
      have[k]=1;list.push({name:p[0],class_label:cls});
    });
    if(!list.length){say(dup?"Aucun nouvel élève : "+dup+" déjà dans la liste.":"Aucun nom trouvé.");return;}
    if(!confirm(list.length+" dossier"+(list.length>1?"s":"")+" à créer"+(dup?" ("+dup+" déjà existant"+(dup>1?"s":"")+", ignoré"+(dup>1?"s":"")+")":"")+". Continuer ?"))return;
    say("Création…");document.getElementById("add").disabled=true;
    (function chunk(a){
      if(a>=list.length){document.getElementById("add").disabled=false;load();return;}
      var part=list.slice(a,a+200),tries=0;
      (function send(){
        var recs=part.map(function(x){return{etab_id:ET?ET.id:undefined,name:x.name,class_label:x.class_label,ref:gen(10),code:gen(12)};});
        sb.from("registry_students").insert(recs).then(function(r){
          if(r.error){
            if(r.error.code==="23505"&&tries++<3){send();return;}   /* collision de code, quasi impossible : on retire au sort */
            document.getElementById("add").disabled=false;load();setTimeout(function(){say(fail(r.error));},400);return;
          }
          chunk(a+200);
        },function(){document.getElementById("add").disabled=false;say("Pas d’internet.");});
      })();
    })(0);
  }

  /* Reprise des classes du compte : un dossier (code + référence) par élève, sans doublon nom+classe */
  function importMine(){
    var btn=document.getElementById("imp");btn.disabled=true;say("Lecture de vos classes…");
    sb.from("classes").select("id,name,students,th").then(function(r){
      if(r.error){btn.disabled=false;say(fail(r.error));return;}
      var have={},list=[],dup=0;
      rows.forEach(function(x){have[nrm(x.name)+"|"+nrm(x.class_label||"")]=1;});
      (r.data||[]).forEach(function(c){
        if(c.th&&c.th.ar)return;
        if(ET&&c.th&&c.th.x&&c.th.x.et&&c.th.x.et!==ET.id)return;   /* classe d’un autre établissement */
        (c.students||[]).forEach(function(st){
          if(!st||!st.name)return;
          var k=nrm(st.name)+"|"+nrm(c.name||"");
          if(have[k]){dup++;return;}
          have[k]=1;list.push({name:String(st.name).slice(0,120),class_label:String(c.name||"").slice(0,80),phone:String(st.p||"").slice(0,30)});
        });
      });
      if(!list.length){btn.disabled=false;say(dup?"Tous vos élèves ont déjà un dossier ("+dup+").":"Aucun élève trouvé dans les classes de ce compte.");return;}
      if(!confirm(list.length+" élève"+(list.length>1?"s":"")+" recevront un code"+(dup?" ("+dup+" déjà existant"+(dup>1?"s":"")+")":"")+". Continuer ?")){btn.disabled=false;say("");return;}
      say("Attribution des codes…");
      (function chunk(a){
        if(a>=list.length){load();setTimeout(function(){say(list.length+" élève"+(list.length>1?"s ont":" a")+" reçu un code. Vous pouvez maintenant exporter la liste, imprimer les cartes ou envoyer les liens.");},600);return;}
        var part=list.slice(a,a+200),tries=0;
        (function send(){
          var recs=part.map(function(x){return{etab_id:ET?ET.id:undefined,name:x.name,class_label:x.class_label,phone:x.phone,ref:gen(10),code:gen(12)};});
          sb.from("registry_students").insert(recs).then(function(w){
            if(w.error){if(w.error.code==="23505"&&tries++<3){send();return;}load();setTimeout(function(){say(fail(w.error));},400);return;}
            chunk(a+200);
          },function(){btn.disabled=false;say("Pas d’internet.");});
        })();
      })(0);
    },function(){btn.disabled=false;say("Pas d’internet.");});
  }

  if(!sb){app.innerHTML='<div style="text-align:center;padding:40px 10px"><h1>Indisponible</h1><p class="sub">La connexion au serveur n’est pas configurée.</p></div>';return;}
  sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    if(s){me=s.user;guard();}else login();
  },function(){login("Pas d’internet.");});
})();
</script>
